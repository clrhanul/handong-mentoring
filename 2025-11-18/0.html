<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: red;

      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 30px;

      transition: 1s;
      transition-timing-function: cubic-bezier(0.075, 0.82, 0.165, 2);
    }

    .box:hover {
      background-color: blue;
      cursor: pointer;
      border-radius: 50%;
      transform: translateX(100px);
    }
    .box::after {
      content: "올려봐!";
    }
    .box:hover::after {
      content: "내려봐!";
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
