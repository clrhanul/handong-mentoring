<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  
  <style>
    .container {
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 250px;
    }

    .box {
      width: 70px; height: 70px;
      background-color: rgb(138, 201, 226);
      margin: 10px;

      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
  </div>
</body>
</html>
