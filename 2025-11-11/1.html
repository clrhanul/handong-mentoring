<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #f8f8f8;
    }
   .card-container {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f8f8f8;
   }
   .card {
    display: flex;
    width: 150px; aspect-ratio: 250/300;
    border-radius: 8px;

    justify-content: center;
    align-items: center;
    box-shadow: 0 0 6px 0 #aaa;
    background-color: white;
    margin: 10px;
   }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>
</body>
</html>
